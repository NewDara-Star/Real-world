<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#e9dcc4" />
    <title>Eko World — walk real Lagos</title>
    <meta name="description" content="Walk real Yaba streets in your browser and talk to whoever is around you. No download, no sign-up." />
    <meta property="og:title" content="Eko World — I dey Yaba, come find me" />
    <meta property="og:description" content="Real Lagos streets. Real people. Free in your browser, no sign-up." />
    <link rel="stylesheet" href="/src/client/style.css" />
  </head>
  <body>
    <canvas id="view"></canvas>

    <div id="hud" hidden>
      <div class="pill" id="where">📍 Yaba</div>
      <div class="pill" id="online">● 1 here</div>
      <button class="pill btn clock" id="clock" title="Skip time (T)">☀️ 15:00</button>
      <button class="pill btn" id="invite">🔗 Invite padi</button>
      <button class="pill btn mute" id="mute" aria-label="Sound on or off">🔊</button>
    </div>
    <div id="drivebar" hidden>
      <button class="pill btn" id="drive-car">🚗 Drive</button>
      <button class="pill btn" id="drive-danfo">🚐 Danfo</button>
      <button class="pill btn" id="drive-exit" hidden>🚶 Get out</button>
      <button class="pill btn" id="wheel-connect" hidden>🎮 Connect wheel</button>
      <button class="pill btn" id="wheel-setup" hidden>🎮 Set up wheel</button>
    </div>
    <div id="speedo" hidden><b id="kmh">0</b><span>km/h</span><i id="gear">1</i></div>
    <div id="calib" hidden><div class="calib-box"><h2 id="calib-title"></h2><p id="calib-hint"></p></div></div>
    <div id="debug" hidden></div>
    <div id="labels"></div>

    <div id="feed"></div>
    <form id="chat" hidden autocomplete="off">
      <input id="chat-input" maxlength="140" placeholder="Talk to people near you…" enterkeyhint="send" />
      <button type="submit" aria-label="Send">➤</button>
    </form>

    <div id="stick"><div id="knob"></div></div>

    <div id="card" hidden>
      <div class="card-head"><span id="card-dot"></span><b id="card-name"></b></div>
      <p id="card-bio"></p>
      <p id="card-dist"></p>
      <div class="card-actions">
        <button id="card-wave">👋 Wave</button>
        <button id="card-close">Close</button>
      </div>
    </div>

    <div id="join">
      <div class="join-box">
        <h1>Eko World</h1>
        <p class="tag">Real Yaba streets. Real people around you. No download, no sign-up.</p>
        <label>What should people call you?<input id="name" maxlength="20" /></label>
        <label>Your vibe <span class="opt">(optional)</span><input id="bio" maxlength="60" placeholder="e.g. Tech sis, looking for good suya" /></label>
        <button id="enter" disabled>Loading Yaba… 0%</button>
        <p class="fine" id="joinnote"></p>
      </div>
    </div>

    <div id="toast" hidden></div>
    <footer id="attrib">Map data © OpenStreetMap contributors, Overture Maps Foundation, Google Open Buildings (Lagos)</footer>
    <script type="module" src="/src/client/main.ts"></script>
  </body>
</html>
